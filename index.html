<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мониторинг Госзакупок Армении (gnumner.minfin.am)</title>

  <!-- Подключение шрифта Inter и стилей Pico -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">

  <style>
    :root {
      --bg-main: #090d16;
      --card-bg: #111827;
      --card-border: #1f293d;
      --accent-color: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.15);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    body { 
      padding: 30px 15px; 
      background-color: var(--bg-main); 
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .container { max-width: 1440px; margin: 0 auto; }

    /* Шапка сайта */
    header { 
      margin-bottom: 24px; 
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 20px 24px; 
      border-radius: 16px;
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      flex-wrap: wrap; 
      gap: 16px; 
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .header-title { display: flex; align-items: center; gap: 12px; }
    .header-title h2 { margin: 0; font-weight: 700; font-size: 1.5em; letter-spacing: -0.02em; }
    .header-subtitle { margin: 4px 0 0 0; color: var(--text-muted); font-size: 0.88em; }

    .status-dot {
      width: 10px;
      height: 10px;
      background-color: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 10px #10b981;
      display: inline-block;
    }

    /* Кнопка обновления */
    .btn-update {
      width: auto;
      margin: 0;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      border: 1px solid #38bdf8;
      border-radius: 10px;
      padding: 10px 20px;
      font-weight: 600;
      font-size: 0.9em;
      color: #fff;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
    }
    .btn-update:hover { 
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(56, 189, 248, 0.4); 
    }
    .btn-update:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* Аккордеон логов */
    details.log-accordion {
      background-color: #030712;
      border: 1px solid var(--card-border);
      border-radius: 14px;
      margin-bottom: 24px;
      overflow: hidden;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
    }
    details.log-accordion summary {
      padding: 12px 18px;
      font-size: 0.85em;
      color: var(--accent-color);
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
      user-select: none;
      background-color: #0b0f19;
      border-bottom: 1px solid transparent;
      transition: background 0.2s;
    }
    details.log-accordion[open] summary {
      border-bottom-color: var(--card-border);
    }
    details.log-accordion summary:hover {
      background-color: #111827;
    }
    .terminal-box {
      margin: 0;
      padding: 14px 18px;
      background-color: #030712;
      color: #38bdf8;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8em;
      line-height: 1.6;
      max-height: 220px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    .terminal-box::-webkit-scrollbar { width: 6px; }
    .terminal-box::-webkit-scrollbar-thumb { background: #1f293d; border-radius: 3px; }

    /* Поиск, фильтры и статистика */
    .toolbar {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 20px;
    }
    .filters-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: flex-end;
    }
    .search-box { flex: 1; min-width: 280px; }
    .search-wrapper { position: relative; width: 100%; }
    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      pointer-events: none;
    }
    .search-box input {
      width: 100%;
      font-size: 0.95em;
      padding: 12px 16px 12px 44px;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: #fff;
      margin-bottom: 0;
      transition: all 0.2s;
    }
    .search-box input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    /* Блок фильтрации по дате */
    .date-filter-group {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 8px 14px;
      border-radius: 12px;
    }
    .date-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .date-field label {
      font-size: 0.75em;
      color: var(--text-muted);
      margin-bottom: 0;
      font-weight: 500;
    }
    .date-field input[type="date"] {
      margin-bottom: 0;
      padding: 6px 10px;
      background-color: #0b0f19;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: #fff;
      font-size: 0.88em;
      font-family: 'JetBrains Mono', monospace;
    }
    .date-field input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(0.8);
      cursor: pointer;
    }
    .btn-reset-dates {
      margin-bottom: 0;
      padding: 7px 12px;
      background-color: rgba(148, 163, 184, 0.1);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      border-radius: 8px;
      font-size: 0.82em;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-reset-dates:hover {
      background-color: rgba(148, 163, 184, 0.2);
      color: #fff;
    }

    .stats { 
      color: var(--text-muted); 
      font-size: 0.88em; 
      font-weight: 500; 
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Карточка таблицы */
    .table-container {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }
    table { margin-bottom: 0; width: 100%; border-collapse: collapse; }

    th {
      background-color: #0d1322;
      color: #94a3b8;
      font-size: 0.82em;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 14px 16px;
      border-bottom: 1px solid var(--card-border);
      white-space: nowrap;
    }
    th.sortable {
      cursor: pointer;
      user-select: none;
      transition: color 0.2s, background-color 0.2s;
    }
    th.sortable:hover {
      background-color: #151d30;
      color: var(--accent-color);
    }
    .sort-icon {
      font-size: 0.85em;
      margin-left: 4px;
      color: #475569;
      display: inline-block;
    }
    .sort-active { color: var(--accent-color); font-weight: bold; }

    td {
      padding: 14px 16px;
      border-bottom: 1px solid #1a2333;
      vertical-align: middle;
      font-size: 0.92em;
    }
    tbody tr { transition: background-color 0.15s; }
    tbody tr:hover { background-color: rgba(30, 41, 59, 0.5); }
    tbody tr:last-child td { border-bottom: none; }

    /* Бейджи */
    .badge-category {
      display: inline-block;
      background-color: rgba(56, 189, 248, 0.1);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.78em;
      font-weight: 600;
      margin-right: 8px;
      font-family: 'JetBrains Mono', monospace;
    }

    .badge-section {
      display: inline-block;
      background-color: rgba(148, 163, 184, 0.08);
      color: #cbd5e1;
      border: 1px solid rgba(148, 163, 184, 0.2);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8em;
      font-weight: 500;
      white-space: nowrap;
    }

    .link-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--accent-color);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.88em;
      padding: 6px 12px;
      background-color: rgba(56, 189, 248, 0.08);
      border-radius: 8px;
      transition: all 0.2s;
    }
    .link-btn:hover {
      background-color: rgba(56, 189, 248, 0.2);
      color: #fff;
      text-decoration: none;
    }

    .date-cell {
      font-family: 'JetBrains Mono', monospace;
      color: #cbd5e1;
      font-size: 0.88em;
    }

    .tender-title-cell { line-height: 1.5; color: #f1f5f9; font-weight: 500; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <div class="header-title">
          <span class="status-dot"></span>
          <h2>Мониторинг Госзакупок Армении</h2>
        </div>
        <p class="header-subtitle">Автоматизированная система парсинга портала gnumner.minfin.am</p>
      </div>
      <button class="btn-update" id="updateBtn" onclick="triggerWorkflow()">🔄 Обновить базу</button>
    </header>

    <details class="log-accordion" open>
      <summary>📟 Лог сканирования системы <span id="logTime">(загрузка...)</span></summary>
      <pre class="terminal-box" id="terminalLogs">Загрузка логов последнего сканирования...</pre>
    </details>

    <div class="toolbar">
      <div class="filters-row">
        <!-- Поиск -->
        <div class="search-box">
          <div class="search-wrapper">
            <span class="search-icon">🔍</span>
            <input type="search" id="searchInput" placeholder="Поиск по названию, процедуре, коду категории [XXXX]..." oninput="filterTable()">
          </div>
        </div>

        <!-- Фильтр по диапазону дат -->
        <div class="date-filter-group">
          <div class="date-field">
            <label for="dateFrom">Дата С:</label>
            <input type="date" id="dateFrom" onchange="filterTable()">
          </div>
          <div class="date-field">
            <label for="dateTo">Дата ПО:</label>
            <input type="date" id="dateTo" onchange="filterTable()">
          </div>
          <button class="btn-reset-dates" onclick="resetFilters()">Сброс</button>
        </div>
      </div>

      <div class="stats" id="statsCounter">Загрузка данных...</div>
    </div>

    <div class="table-container">
      <table role="grid">
        <thead>
          <tr>
            <th class="sortable" onclick="handleSort('num')" style="width: 5%;">№ <span id="sort-num" class="sort-icon">↕</span></th>
            <th class="sortable" style="width: 20%;" onclick="handleSort('section')">Тип процедуры <span id="sort-section" class="sort-icon">↕</span></th>
            <th class="sortable" style="width: 14%;" onclick="handleSort('date')">Публикация <span id="sort-date" class="sort-icon">↕</span></th>
            <th class="sortable" style="width: 14%;" onclick="handleSort('end_date')">Завершение <span id="sort-end_date" class="sort-icon">↕</span></th>
            <th class="sortable" onclick="handleSort('title')">Наименование тендера <span id="sort-title" class="sort-icon">↕</span></th>
            <th style="width: 10%; text-align: center;">Ссылка</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="6" style="text-align: center; padding: 40px; color: #64748b;">Загрузка базы данных...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const GH_USER = 'NinoGrey';
    const GH_REPO = 'gnumner-tracker';
    const WORKFLOW_ID = 'tracker.yml';

    let allTenders = [];
    let displayedTenders = [];

    // Состояние сортировки
    let currentSortField = 'date';
    let currentSortOrder = 'desc';

    async function loadData() {
      try {
        const res = await fetch('data.json?v=' + new Date().getTime());
        const rawData = await res.json();

        const total = rawData.length;
        allTenders = rawData.map((item, index) => ({
          ...item,
          num: total - index
        }));

        filterTable();
      } catch (err) {
        document.getElementById('tableBody').innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 40px; color: #ef4444;">База данных пока пуста. Нажмите «Обновить базу».</td></tr>';
        document.getElementById('statsCounter').innerText = 'Найдено тендеров: 0';
      }

      loadLogs();
    }

    async function loadLogs() {
      try {
        const res = await fetch('log.json?v=' + new Date().getTime());
        const logData = await res.json();

        document.getElementById('logTime').innerText = `[Обновлено: ${logData.timestamp || '—'}]`;
        document.getElementById('terminalLogs').innerText = logData.logs.join('\n');
      } catch (err) {
        document.getElementById('logTime').innerText = '';
        document.getElementById('terminalLogs').innerText = 'Лог последнего сканирования недоступен.';
      }
    }

    function parseDateStr(str) {
      if (!str || str === '—') return new Date(0);
      const parts = str.split('.');
      if (parts.length === 3) {
        return new Date(parts[2], parts[1] - 1, parts[0]);
      }
      return new Date(0);
    }

    // Преобразование формата "24.08.2026" -> "2026-08-24" для сравнения с <input type="date">
    function formatDateToISO(str) {
      if (!str || str === '—') return '';
      const parts = str.trim().split('.');
      if (parts.length === 3) {
        return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
      }
      return '';
    }

    function handleSort(field) {
      if (currentSortField === field) {
        currentSortOrder = currentSortOrder === 'asc' ? 'desc' : 'asc';
      } else {
        currentSortField = field;
        currentSortOrder = 'asc';
      }
      applySortAndRender();
    }

    function applySortAndRender() {
      // Обновление иконок сортировки в заголовке
      ['num', 'section', 'date', 'end_date', 'title'].forEach(f => {
        const icon = document.getElementById(`sort-${f}`);
        if (f === currentSortField) {
          icon.innerText = currentSortOrder === 'asc' ? '▲' : '▼';
          icon.className = 'sort-icon sort-active';
        } else {
          icon.innerText = '↕';
          icon.className = 'sort-icon';
        }
      });

      displayedTenders.sort((a, b) => {
        let valA = a[currentSortField] || '';
        let valB = b[currentSortField] || '';

        let result = 0;

        if (currentSortField === 'num') {
          result = a.num - b.num;
        } else if (currentSortField === 'date' || currentSortField === 'end_date') {
          result = parseDateStr(valA) - parseDateStr(valB);
        } else {
          result = valA.toString().localeCompare(valB.toString(), 'ru');
        }

        return currentSortOrder === 'asc' ? result : -result;
      });

      renderTable(displayedTenders);
    }

    function renderTable(data) {
      const tbody = document.getElementById('tableBody');
      document.getElementById('statsCounter').innerHTML = `📊 Отображено тендеров: <strong>${data.length}</strong> (из ${allTenders.length} в базе)`;

      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 40px; color: #94a3b8;">Ничего не найдено по вашему запросу.</td></tr>';
        return;
      }

      tbody.innerHTML = data.map(item => {
        const categoryBadge = item.category 
          ? `<span class="badge-category">${item.category}</span>`
          : '';

        const sectionBadge = item.section 
          ? `<span class="badge-section">${item.section}</span>`
          : '—';

        const pubDate = item.date || '—';
        const endDate = item.end_date || '—';

        return `
          <tr>
            <td><strong style="color: #64748b;">${item.num}</strong></td>
            <td>${sectionBadge}</td>
            <td class="date-cell">${pubDate}</td>
            <td class="date-cell">${endDate}</td>
            <td class="tender-title-cell">${categoryBadge}${item.title}</td>
            <td style="text-align: center;"><a href="${item.url}" class="link-btn" target="_blank" rel="noopener">Открыть 🔗</a></td>
          </tr>
        `;
      }).join('');
    }

    function filterTable() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const dateFrom = document.getElementById('dateFrom').value; // 'YYYY-MM-DD'
      const dateTo = document.getElementById('dateTo').value;     // 'YYYY-MM-DD'

      displayedTenders = allTenders.filter(item => {
        // 1. Поисковый текстовый запрос
        const titleMatch = item.title && item.title.toLowerCase().includes(query);
        const categoryMatch = item.category && item.category.toLowerCase().includes(query);
        const sectionMatch = item.section && item.section.toLowerCase().includes(query);
        const dateMatch = item.date && item.date.toLowerCase().includes(query);
        const endDateMatch = item.end_date && item.end_date.toLowerCase().includes(query);
        const numMatch = item.num && item.num.toString() === query;

        const matchesText = !query || (titleMatch || categoryMatch || sectionMatch || dateMatch || endDateMatch || numMatch);

        // 2. Фильтрация по дате публикации (item.date)
        const itemDateISO = formatDateToISO(item.date);
        let matchesDateFrom = true;
        let matchesDateTo = true;

        if (dateFrom) {
          matchesDateFrom = itemDateISO >= dateFrom;
        }
        if (dateTo) {
          matchesDateTo = itemDateISO <= dateTo;
        }

        return matchesText && matchesDateFrom && matchesDateTo;
      });

      applySortAndRender();
    }

    function resetFilters() {
      document.getElementById('searchInput').value = '';
      document.getElementById('dateFrom').value = '';
      document.getElementById('dateTo').value = '';
      filterTable();
    }

    async function triggerWorkflow() {
      const btn = document.getElementById('updateBtn');

      let token = localStorage.getItem('gh_token');
      if (!token) {
        token = prompt('Введите ваш GitHub Personal Access Token (ghp_...):');
        if (!token) return;
        localStorage.setItem('gh_token', token.trim());
      }

      btn.disabled = true;
      btn.innerText = '⏳ Запуск парсера...';
      document.getElementById('terminalLogs').innerText = '🚀 Запуск GitHub Actions workflow...\nОжидание выполнения задачи на сервере...';

      try {
        const response = await fetch(`https://api.github.com/repos/${GH_USER}/${GH_REPO}/actions/workflows/${WORKFLOW_ID}/dispatches`, {
          method: 'POST',
          headers: {
            'Accept': 'application/vnd.github+json',
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ ref: 'main' })
        });

        if (response.ok) {
          btn.innerText = '⚙️ Сканирование сайта...';
          setTimeout(() => {
            btn.innerText = '🔄 Обновить базу';
            btn.disabled = false;
            loadData();
          }, 25000);
        } else {
          localStorage.removeItem('gh_token');
          alert('Ошибка доступа! Проверьте токен.');
          btn.innerText = '🔄 Обновить базу';
          btn.disabled = false;
        }
      } catch (err) {
        alert('Сбой сети при подключении к GitHub API.');
        btn.innerText = '🔄 Обновить базу';
        btn.disabled = false;
      }
    }

    loadData();
  </script>
</body>
</html>
