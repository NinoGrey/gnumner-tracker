<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мониторинг Госзакупок Армении (gnumner.minfin.am)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
  <style>
    body { padding: 20px; background-color: #0f172a; color: #f1f5f9; }
    .container { max-width: 1200px; margin: 0 auto; }
    
    header { 
      margin-bottom: 25px; 
      border-bottom: 1px solid #334155; 
      padding-bottom: 15px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      flex-wrap: wrap; 
      gap: 15px; 
    }
    header h2 { margin-bottom: 0; }
    
    .search-box { margin-bottom: 15px; }
    .search-box input { width: 100%; font-size: 1.1em; padding: 12px; }
    table a { color: #38bdf8; text-decoration: none; font-weight: bold; }
    table a:hover { text-decoration: underline; }
    .stats { color: #94a3b8; font-size: 0.9em; margin-bottom: 15px; }
    
    .badge-category {
      display: inline-block;
      background-color: #1e293b;
      color: #38bdf8;
      border: 1px solid #0284c7;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.75em;
      font-weight: 600;
      margin-right: 8px;
      white-space: nowrap;
      vertical-align: middle;
    }
    .tender-title-cell { line-height: 1.5; }
    
    .btn-update {
      width: auto;
      margin-bottom: 0;
      background-color: #0284c7;
      border-color: #0284c7;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-update:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h2>🏛️ Мониторинг Госзакупок Армении</h2>
        <p><small>База всех объявлений с gnumner.minfin.am</small></p>
      </div>
      <button class="btn-update" id="updateBtn" onclick="triggerWorkflow()">🔄 Обновить базу</button>
    </header>

    <div class="search-box">
      <input type="search" id="searchInput" placeholder="Введите название, категорию, № или дату (например: հագուստ, Аукцион, 105, 24.08)..." onkeyup="filterTable()">
    </div>

    <div class="stats" id="statsCounter">Загрузка данных...</div>

    <figure>
      <table role="grid">
        <thead>
          <tr>
            <th style="width: 6%;">№</th>
            <th style="width: 14%;">Дата публикации</th>
            <th style="width: 14%;">Дата завершения</th>
            <th>Наименование тендера / процедуры</th>
            <th style="width: 12%;">Документы</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="5">Загрузка базы данных...</td></tr>
        </tbody>
      </table>
    </figure>
  </div>

  <script>
    const GH_USER = 'NinoGrey';
    const GH_REPO = 'gnumner-tracker';
    const WORKFLOW_ID = 'tracker.yml';

    let allTenders = [];

    async function loadData() {
      try {
        const res = await fetch('data.json?v=' + new Date().getTime());
        const rawData = await res.json();
        
        // Обратная нумерация: самый старый тендер (в конце массива) получает № 1,
        // самый свежий (в начале массива) — максимальный № N. 
        // При добавлении новых свежих тендеров номера старых тендеров не смещаются.
        const total = rawData.length;
        allTenders = rawData.map((item, index) => ({
          ...item,
          num: total - index
        }));

        renderTable(allTenders);
      } catch (err) {
        document.getElementById('tableBody').innerHTML = '<tr><td colspan="5">База данных пока пуста. Нажмите «Обновить базу».</td></tr>';
        document.getElementById('statsCounter').innerText = 'Найдено тендеров: 0';
      }
    }

    function renderTable(data) {
      const tbody = document.getElementById('tableBody');
      document.getElementById('statsCounter').innerText = `Отображено тендеров: ${data.length} (из ${allTenders.length} всего)`;

      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5">Ничего не найдено по вашему запросу.</td></tr>';
        return;
      }

      tbody.innerHTML = data.map(item => {
        const categoryBadge = item.category 
          ? `<span class="badge-category">${item.category}</span>`
          : '';

        const pubDate = item.date || '—';
        const endDate = item.end_date || item.deadline || '—';

        return `
          <tr>
            <td><strong>${item.num}</strong></td>
            <td><small>${pubDate}</small></td>
            <td><small>${endDate}</small></td>
            <td class="tender-title-cell">${categoryBadge}${item.title}</td>
            <td><a href="${item.url}" target="_blank" rel="noopener">Открыть 🔗</a></td>
          </tr>
        `;
      }).join('');
    }

    function filterTable() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      
      if (!query) {
        renderTable(allTenders);
        return;
      }

      const filtered = allTenders.filter(item => {
        const titleMatch = item.title && item.title.toLowerCase().includes(query);
        const categoryMatch = item.category && item.category.toLowerCase().includes(query);
        const dateMatch = item.date && item.date.toLowerCase().includes(query);
        const endDateMatch = (item.end_date || item.deadline) && (item.end_date || item.deadline).toLowerCase().includes(query);
        const numMatch = item.num && item.num.toString() === query;

        return titleMatch || categoryMatch || dateMatch || endDateMatch || numMatch;
      });

      renderTable(filtered);
    }

    async function triggerWorkflow() {
      const btn = document.getElementById('updateBtn');
      
      let token = localStorage.getItem('gh_token');
      if (!token) {
        token = prompt('Введите ваш GitHub Personal Access Token (ghp_...):');
        if (!token) return;
        localStorage.setItem('gh_token', token.trim());
      }

      btn.disabled = true;
      btn.innerText = '⏳ Запуск парсера...';

      try {
        const response = await fetch(`https://api.github.com/repos/${GH_USER}/${GH_REPO}/actions/workflows/${WORKFLOW_ID}/dispatches`, {
          method: 'POST',
          headers: {
            'Accept': 'application/vnd.github+json',
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ ref: 'main' })
        });

        if (response.ok) {
          btn.innerText = '⚙️ Сканирование сайта...';
          setTimeout(() => {
            btn.innerText = '🔄 Обновить базу';
            btn.disabled = false;
            loadData();
          }, 25000);
        } else {
          localStorage.removeItem('gh_token');
          alert('Ошибка доступа! Проверьте правильность токена и его права (repo / workflow).');
          btn.innerText = '🔄 Обновить базу';
          btn.disabled = false;
        }
      } catch (err) {
        alert('Сбой сети при подключении к GitHub API.');
        btn.innerText = '🔄 Обновить базу';
        btn.disabled = false;
      }
    }

    loadData();
  </script>
</body>
</html>
