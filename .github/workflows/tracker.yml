name: Gnumner All Tenders Collector

on:
  schedule:
    # Запуск каждые 30 минут по будням
    - cron: '*/30 4-15 * * 1-5'
  workflow_dispatch: # Возможность запустить вручную одной кнопкой

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Сбор всех тендеров
        run: python main.py

      - name: Сохранение обновленной базы в репозиторий
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data.json
          git diff-index --quiet HEAD || git commit -m "Update all tenders list"
          git push
