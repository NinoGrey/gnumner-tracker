name: Gnumner All Tenders Collector

on:
  workflow_dispatch: # Ручной запуск из вкладки Actions
  repository_dispatch: # Запуск по API при клике на кнопку «Обновить базу»
    types: [update-database]
  # schedule:
  #   - cron: '0 */3 * * *' # Пример: запуск каждые 3 часа

permissions:
  contents: write

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Настройка Python и uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
          enable-cache: true

      - name: Установка зависимостей
        run: uv pip install -r requirements.txt

      - name: Сбор всех тендеров
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: uv run python parser.py # Убедитесь, что файл называется parser.py

      - name: Сохранение обновленной базы и логов
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git pull origin main --rebase || true
          git add data.json log.json || true
          git commit -m "Update tenders list and logs" || exit 0
          git push
