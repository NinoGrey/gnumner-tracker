name: Gnumner All Tenders Collector

on:
  workflow_dispatch: # Ручной запуск из вкладки Actions в GitHub
  repository_dispatch: # Запуск по API при клике на кнопку «Обновить базу»
    types: [update-database]

# Явное разрешение боту записывать изменения в репозиторий
permissions:
  contents: write

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Сбор всех тендеров
        run: python main.py

      - name: Сохранение обновленной базы и логов
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git pull origin main --rebase || true
          git add data.json log.json || true
          git commit -m "Update tenders list and logs" || exit 0
          git push
